name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          docker build -t php-app:${{ github.sha }} .
          docker push php-app:${{ github.sha }}
      - name: Deploy to K8s
        run: |
          kubectl set image deployment/php-app php-app=php-app:${{ github.sha }}
